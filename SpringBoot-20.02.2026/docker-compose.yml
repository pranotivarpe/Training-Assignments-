version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: voting-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: voting_system
      MYSQL_USER: votinguser
      MYSQL_PASSWORD: votingpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - voting-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  app:
    build: .
    container_name: voting-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: voting_system
      MYSQL_USER: votinguser
      MYSQL_PASSWORD: votingpass
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-network

volumes:
  mysql_data:

networks:
  voting-network:
    driver: bridge
