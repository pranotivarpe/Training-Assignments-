<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Online Voting System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <h2>Create Account</h2>
        <p class="subtitle">Register to participate in elections</p>

        <div th:if="${errorMessage}" class="alert alert-danger">
          <span th:text="${errorMessage}"></span>
        </div>

        <form
          th:action="@{/register}"
          th:object="${registration}"
          method="post"
        >
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              th:field="*{fullName}"
              class="form-control"
              th:classappend="${#fields.hasErrors('fullName')} ? 'error' : ''"
              placeholder="Enter your full name"
              required
            />
            <span
              th:if="${#fields.hasErrors('fullName')}"
              th:errors="*{fullName}"
              class="error-text"
            ></span>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              th:field="*{email}"
              class="form-control"
              th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"
              placeholder="Enter your email"
              required
            />
            <span
              th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"
              class="error-text"
            ></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              th:field="*{password}"
              class="form-control"
              th:classappend="${#fields.hasErrors('password')} ? 'error' : ''"
              placeholder="Minimum 6 characters"
              required
            />
            <span
              th:if="${#fields.hasErrors('password')}"
              th:errors="*{password}"
              class="error-text"
            ></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              th:field="*{confirmPassword}"
              class="form-control"
              th:classappend="${#fields.hasErrors('confirmPassword')} ? 'error' : ''"
              placeholder="Re-enter your password"
              required
            />
            <span
              th:if="${#fields.hasErrors('confirmPassword')}"
              th:errors="*{confirmPassword}"
              class="error-text"
            ></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Create Account
          </button>
        </form>

        <p
          style="
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-light);
          "
        >
          Already have an account?
          <a th:href="@{/login}" style="font-weight: 600;">Sign in</a>
        </p>
      </div>
    </div>
  </body>
</html>
