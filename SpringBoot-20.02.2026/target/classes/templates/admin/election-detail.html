<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Election - Online Voting System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <a href="/admin/dashboard" class="navbar-brand">&#127911; Admin Panel</a>
      <ul class="navbar-nav">
        <li><a th:href="@{/admin/dashboard}">Back to Admin</a></li>
      </ul>
    </nav>

    <div class="container">
      <!-- Alerts -->
      <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
      </div>
      <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
      </div>

      <!-- Election Info -->
      <div class="card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
          "
        >
          <div>
            <h2
              th:text="${election.title}"
              style="color: var(--dark); margin-bottom: 0.5rem;"
            ></h2>
            <p
              th:text="${election.description}"
              style="color: var(--text-light); margin-bottom: 0.5rem;"
            ></p>
            <div class="meta">
              <span
                th:text="'Start: ' + ${#temporals.format(election.startDate, 'dd MMM yyyy, hh:mm a')}"
              ></span>
              <span
                th:text="'End: ' + ${#temporals.format(election.endDate, 'dd MMM yyyy, hh:mm a')}"
              ></span>
            </div>
          </div>
          <span
            class="badge"
            th:classappend="${election.computeStatus().name() == 'ACTIVE'} ? 'badge-active' : (${election.computeStatus().name() == 'UPCOMING'} ? 'badge-upcoming' : 'badge-completed')"
            th:text="${election.computeStatus().name()}"
          ></span>
        </div>
      </div>

      <!-- Candidates -->
      <div class="card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
          "
        >
          <div
            class="card-header"
            style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;"
          >
            Candidates
          </div>
          <a
            th:href="@{/admin/elections/{id}/candidates/add(id=${election.id})}"
            class="btn btn-primary btn-sm"
            >+ Add Candidate</a
          >
        </div>

        <div th:if="${#lists.isEmpty(candidates)}" class="empty-state">
          <p>No candidates added yet. Add candidates to this election.</p>
        </div>

        <div class="table-container" th:unless="${#lists.isEmpty(candidates)}">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Party</th>
                <th>Description</th>
                <th>Votes</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="candidate : ${candidates}">
                <td th:text="${candidate.name}"></td>
                <td th:text="${candidate.party ?: 'Independent'}"></td>
                <td th:text="${candidate.description ?: '-'}"></td>
                <td th:text="${candidate.getVoteCount()}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="actions">
        <a
          th:href="@{/elections/{id}/results(id=${election.id})}"
          class="btn btn-secondary"
          >View Public Results</a
        >
        <form
          th:action="@{/admin/elections/{id}/delete(id=${election.id})}"
          method="post"
          style="display: inline;"
        >
          <button
            type="submit"
            class="btn btn-danger"
            onclick="return confirm('Are you sure? This will delete the election and all associated votes.');"
          >
            Delete Election
          </button>
        </form>
      </div>
    </div>

    <footer class="footer">
      <p>&copy; 2026 Online Voting System. Admin Panel.</p>
    </footer>
  </body>
</html>
