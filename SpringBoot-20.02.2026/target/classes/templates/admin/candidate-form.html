<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Candidate - Online Voting System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <a href="/admin/dashboard" class="navbar-brand">&#127911; Admin Panel</a>
      <ul class="navbar-nav">
        <li>
          <a th:href="@{/admin/elections/{id}(id=${election.id})}"
            >Back to Election</a
          >
        </li>
      </ul>
    </nav>

    <div class="container" style="max-width: 600px;">
      <div class="card">
        <div class="card-header">
          Add Candidate to: <span th:text="${election.title}"></span>
        </div>

        <form
          th:action="@{/admin/elections/{id}/candidates(id=${election.id})}"
          th:object="${candidate}"
          method="post"
        >
          <div class="form-group">
            <label for="name">Candidate Name *</label>
            <input
              type="text"
              id="name"
              th:field="*{name}"
              class="form-control"
              th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"
              placeholder="Full name of the candidate"
              required
            />
            <span
              th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
              class="error-text"
            ></span>
          </div>

          <div class="form-group">
            <label for="party">Party / Affiliation</label>
            <input
              type="text"
              id="party"
              th:field="*{party}"
              class="form-control"
              placeholder="e.g., Independent, Party A"
            />
          </div>

          <div class="form-group">
            <label for="description">Description / Bio</label>
            <textarea
              id="description"
              th:field="*{description}"
              class="form-control"
              rows="3"
              placeholder="Brief bio or manifesto of the candidate"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="photoUrl">Photo URL (optional)</label>
            <input
              type="text"
              id="photoUrl"
              th:field="*{photoUrl}"
              class="form-control"
              placeholder="https://example.com/photo.jpg"
            />
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">Add Candidate</button>
            <a
              th:href="@{/admin/elections/{id}(id=${election.id})}"
              class="btn btn-secondary"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
